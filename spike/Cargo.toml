# Phase 1 parser spike.  Mirrors the scripts/rust workspace conventions it would have to
# live under: same toolchain pin, same lint wall, no dependency the workspace does not
# already tolerate.
[package]
name = "luadox-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[dependencies]
# Pinned exactly, the way .github/workflows/metadata-parity-canary-pr.yml pins its
# Python pair: a grammar that moves changes the parse without anybody changing the tool.
tree-sitter = "=0.26.13"
tree-sitter-lua = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
