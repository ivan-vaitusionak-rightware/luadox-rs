# Differences between the Rust luadox and the Python oracle that are deliberate.
#
# This file is a changelog of improvements, not a list of excuses. An entry earns its
# place by naming the defect it fixes; an entry whose difference has gone away is an
# error, the same as an unexplained difference, because a stale entry hides a
# regression.
#
# Only RENDERED OUTPUT is held to parity: html, luals and json. Diagnostics, exit codes
# and error handling are expected to improve and are reported as a delta, never as a
# failure -- so they do not belong here.
#
# There is no wildcard. An L2 entry names every file it explains, and an L1 entry names
# the JSON path fragment every difference it explains must contain. That is what keeps
# the list from quietly becoming the specification: an entry that would need hundreds of
# filenames is not an improvement, it is an unreviewed rewrite of the output.
#
#   level                = "L1" (json) or "L2" (html / luals bytes)
#   paths                = output files this entry explains (L2)
#   json_path_contains   = fragment every differing JSON path must contain (L1)
#   fix                  = the defect being fixed, in one line
#   why                  = why the rendered output moves as a result
#   present_in_corpus    = false when the corpus does not exercise it yet, so the entry
#                          is allowed to explain nothing

[[improvement]]
level = "L1"
json_path_contains = ".value"
fix = "A field value whose expression spans more than one line is no longer dropped."
why = """
The Python's `_parse_field` returns None whenever the brackets or quotes on the line
are unbalanced, which is how it detects a continuation. 205 field values in the corpus
are lost that way, all of them `MessageType:find(...)` calls in autogen/metadata. The
parser knows where the expression ends, so the value survives into `doc.json`.

No html page moves: `html.py:171` renders a field's value only inside an `@enum`, and
every enum member in this corpus is an integer literal on one line. The LuaLS renderer
does not read `value` at all.
"""

[[improvement]]
level = "L1"
json_path_contains = ".value"
fix = "A `--` inside a string literal no longer truncates the line."
why = """
`strip_trailing_comment` is `re.sub(r'--.*', '', line)`, so `S.sep = "a--b"` loses its
value. Zero occurrences in the production corpus today, so this explains no difference here;
the entry exists so the harness accepts one the day a string containing `--` is added.
"""
present_in_corpus = false

[[improvement]]
level = "L2"
paths = []
fix = "A declaration inside a `--[[ ]]` long comment is no longer documented."
why = """
The line scanner has no notion of a long comment, so `--- function L:ghost() end` inside
one produces a real page entry. Zero occurrences in the production corpus today. When one
appears, the page it lands on is named here.
"""
present_in_corpus = false

# ---------------------------------------------------------------------------------
# A diagnostic is not an improvement in the sense above -- diagnostics are never held to
# parity and never fail a run -- but a *new* category is worth naming here so the delta
# report can be read without archaeology. This entry explains nothing at L1 or L2 by
# construction, which is why it is marked as not exercised by the corpus.

[[improvement]]
level = "L1"
json_path_contains = "(this entry explains no output difference)"
fix = "A new diagnostic: compact-block-content."
why = """
A `@compact` collection has no detail box, so the html renderer puts a member's entire
documentation into the one-line synopsis cell, while a non-compact row gets only the
first sentence and the rest goes to a detail box. When that documentation is a code
block, a heading or a list it is emitted but unreadable: the stylesheet has no rule for a
block element inside `div.synopsis td`, so a `<pre>` falls through to
`div.body pre { margin: 0 2em }` inside an already-padded cell.

On the pinned corpus that is 240 elements over 50 files: 166 carrying `<h5>` and `<pre>`
from an `@example` on a member of a compact `@table`, and 85 carrying `<ul>` from a
bullet list in a property tooltip. Nothing reported it -- it reads correctly in the
source and in the html, and is wrong only in a browser.

The Python finds this by matching a regular expression against rendered html (luadox
PR #14, branch `luals-compact-block-content`, which is not in the pinned oracle). The
Rust makes it unrepresentable instead: `markdown::Inline` has no public constructor, the
only route to it is the fallible `Block::into_inline`, and every one-line renderer in
`render::row` takes `RowContent`, which only that conversion produces. A future tag
combination that puts block content in a row fails to compile rather than shipping a
broken page.

The diagnostic is raised at the single conversion site, `prerender::fit_to_row`. It moves
no rendered output: doc.json is unchanged by it, and the html bytes the oracle produces
for these 240 cases must still be reproduced in Phase 4.
"""
present_in_corpus = false

[[improvement]]
level = "L1"
json_path_contains = "(this entry explains no output difference)"
fix = "The LuaLS renderer no longer reports an untyped parameter a second time."
why = """
The prerender stage reports every parameter that the source declares and no `@tparam`
documents:

    <name>() missing @tparam for "<param>" parameter

and the oracle's LuaLS renderer then reports the same parameter again, under the same
category, at the same line, with a different message:

    parameter "<name>" of <symbol> has no documented type

The two are exactly coextensive: a `@tparam` cannot parse without a type list, so "has
no types" and "has no @tparam" are the same set. A luals run therefore reports every gap
twice. spec/luals.md section 8.2 records this, and says an implementation that reports it
once is better and should be recorded here rather than silently matched -- which is what
this entry is.

Measured across the 17 fixtures, the only luals-run diagnostic difference in either
direction is this one:

    rust only  : none
    oracle only: {'untyped': 1}
      [untyped] types: parameter "a" of Shape.undocumented has no documented type

It moves no rendered output. `luadox.lua` is byte-identical on all 17 fixtures and on the
pinned corpus.
"""
present_in_corpus = false

[[improvement]]
level = "L2"
paths = ["html/class/DepthTargetPass.html"]
fix = "comrak has no CODE_INDENT equivalent, so one indented continuation line becomes a code block."
why = """
The oracle sets `commonmark.blocks.CODE_INDENT = 1000` globally at import time, which
disables indented code blocks -- and, because the same constant drives
`parser.indented`, also lets a block quote, heading, fence, html block, setext heading,
thematic break or list item start at any indentation. comrak has no equivalent knob:
`comrak::options::Parse` has nothing about indentation. Both halves are divergences.

Measured by harness/markdown_parity.py, which renders every string the oracle's
`_markdown_to_html` is called with through both libraries -- 7451 renders, 4962 distinct
strings -- exactly one differs:

    lua/src/autogen/DepthTargetPass.lua:21
      --- @see TargetPass for a target with color attachments and for a sampler you configure
      ---      yourself.

    markdown handed to the renderer:
      '     yourself.'

    oracle:  <p>yourself.</p>
    comrak:  <pre><code> yourself.
             </code></pre>

The continuation is indented five spaces after the `@see` line, which puts it past four
once the tag's own indent is taken off. The fix belongs in the source -- that line is
mis-indented whatever renders it -- and the source is the corpus tree, which this project
only reads. Until it is fixed there, this page differs.

The second half of the divergence is not exercised: the corpus has 42 lines indented four
or more spaces starting with `-`, and 6 following a blank line, and all of them are
paragraph continuations where `indented` decides nothing. markdown_parity.py is the guard
that keeps that true, and it fails on any difference on a page this file does not name.
"""
